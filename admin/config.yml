local_backend: true

# logo_url: https://health.joanneum.at/git/PreNudge/prenudge-health-profile/raw/branch/main/media/MetadatenIcon.png

backend:
  name: github
  base_url: https://sveltia-cms-auth.jr-health.workers.dev
  branch: main
  repo: jr-health/prenudge-health-profile


#publish_mode: editorial_workflow   # The Gitea backend does not support editorial workflow.

media_folder: media
public_folder: /media

i18n:
  structure: single_file            # 'single_file' speichert de und en zusammen in einer JSON-Datei.
  locales: [de, en]
  default_locale: de

collections:

