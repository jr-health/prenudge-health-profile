  - name: categories
    label: "Categories"
    label_singular: "Category"
    folder: hp-categories
    create: true
    i18n: true
    extension: json
    format: json
    slug: "{{key}}"
    # summary: "{{title}} [{{subject-area}}]"
    summary: "{{title}}"

    fields:
      - label: Template
        name: template
        widget: hidden
        default: category
        i18n: duplicate

      - label: "Category Key (TECH)"
        name: key
        widget: string
        i18n: duplicate
        hint: "Machine-readable category identifier; kebab-case slug derived from the English title, e.g. physical-activity"
        pattern: [ '^[a-z0-9][a-z0-9\-]*[a-z0-9]$', "Only lowercase letters, numbers and hyphens" ]

      #      - label: Subject Area
#        name: subject-area
#        widget: relation
#        collection: subject-areas
#        search_fields: [id_tech, title, description]
#        value_field: id_tech
#        display_fields: ["{{title}} - {{key}}"]
#        i18n: duplicate

      - label: "Category Title (MED)"
        name: title
        widget: string
        i18n: translate
        hint: 'Human-readable title of “PreNUDGE category”'

#      - label: "Lucide Icon Name"
#        name: "icon_lucide"
#        required: false
#        widget: "string"
#        i18n: duplicate

      - label: "Icon Upload (TECH)"
        name: "icon_upload"
        required: false
        widget: "image"
        i18n: duplicate
        media_library:
          config:
            multiple: false
        hint: "Representative icon (e.g., Lucide) for the category"

      - label: "Color (TECH)"
        name: color
        widget: "color"
        allowInput: true
        required: false
        i18n: duplicate
        hint: 'Assigned "PreNUDGE hex category" color code according to corporate design guide'

      - label: "Category description (professional) (MED)"
        name: description-professional
        required: false
        widget: richtext
        i18n: translate
        hint: "Category description for healthcare professionals"

      - label: "Category description (layman) (MED)"
        name: description-laymen
        required: false
        widget: richtext
        i18n: translate
        hint: "Category description in layman language for citizens"

      - label: "Comments / Discussion Section for MED"
        name: discussion
        required: false
        widget: richtext
        i18n: duplicate


  - label: "Indicator Dimensions"
    name: dimensions
    label_singular: "Indicator Dimension"
    folder: hp-dimensions
    create: true
    i18n: true
    extension: json
    format: json
    slug: "{{key}}"
    summary: "{{title}} · {{category}}"
    sortable_fields: ["category", "title"]
    fields:
      - label: Template
        name: template
        widget: hidden
        default: dimension
        i18n: duplicate

      - label: "Indicator dimension key (TECH)"
        name: key
        widget: string
        i18n: duplicate
        hint: "Machine-readable indicator dimension identifier; kebab-case slug derived from the English title, e.g. physical-activity"
        pattern: [ '^[a-z0-9][a-z0-9\-]*[a-z0-9]$', "Only lowercase letters, numbers and hyphens" ]

      - label: "Category (MED)"
        name: category
        widget: relation
        collection: categories
        search_fields: [key, title]
        value_field: key
        display_fields: ["{{title}} - {{key}}"]
        i18n: duplicate
        hint: 'Assignment of previously defined “PreNUDGE category"'

      - label: "Indicator dimension Title (MED)"
        name: title
        widget: string
        i18n: translate
        hint: 'Human-readable title of “PreNUDGE indicator dimension”'

      - label: "Indicator dimension Description (professional) (MED)"
        name: description_professional
        required: false
        widget: richtext
        i18n: translate
        hint: "Indicator dimension description for healthcare professionals"

      - label: "Indicator dimension Description (layman) (MED)"
        name: description_layman
        required: false
        widget: richtext
        i18n: translate
        hint: "Indicator dimension description in layman language for citizens"

      - label: "Verified Austrian Health Information (MED)"
        name: verified-health-links
        required: false
        widget: "list"
        i18n: true
        summary: "{{title}} · {{url}}"
        hint: "Links to relevant information on gesundheit.gv.at"
        fields:
          - label: "Link Title"
            name: "title"
            widget: "string"
            required: false
            i18n: translate

          - label: "URL"
            name: "url"
            widget: "string"
            required: false
            i18n: duplicate

          - label: "Short Note"
            name: "note"
            widget: "text"
            required: false
            i18n: translate

      - label: "Comments / Discussion Section for MED"
        name: discussion
        required: false
        widget: richtext
        i18n: duplicate

  - name: observations
    label: Observations
    label_singular: "Observation"
    folder: hp-observations
    create: true
    i18n: true
    extension: json
    format: json
    slug: "{{key}}"
    summary: "{{title}} · {{dimension}} · {{category}}"
    sortable_fields: ["category", "title", "dimension"]
    fields:
      - label: Template
        name: template
        widget: hidden
        default: observation
        i18n: duplicate

      - label: "Observation key (TECH)"
        name: key
        widget: string
        i18n: duplicate
        hint: "Machine-readable observation identifier; kebab-case slug derived from the English title, e.g. physical-activity"
        pattern: [ '^[a-z0-9][a-z0-9\-]*[a-z0-9]$', "Only lowercase letters, numbers and hyphens" ]

      - label: "Observation Title (MED)"
        name: title
        widget: string
        i18n: translate
        hint: 'Human-readable title of “PreNUDGE observation”'

      - label: "Observation Description (professional) (MED)"
        name: description
        required: false
        hint: "Observation description for healthcare professionals; include population ... information when relevant."
        widget: richtext
        i18n: translate

      - label: "Citizen information (layman) (MED)"
        name: citizen-info
        required: false
        widget: richtext
        i18n: translate
        hint: "Simple lay-language explanation of why this health indicator is important for prevention."

      - label: "Category (MED)"
        name: category
        widget: relation
        collection: categories
        search_fields: [key, title]
        value_field: key
        display_fields: ["{{title}} - {{key}}"]
        i18n: duplicate
        hint: 'Assignment of previously defined “PreNUDGE category"'

      - label: "Indicator Dimension (MED)"
        name: dimension
        widget: relation
        collection: dimensions
        search_fields: [ key, title]
        value_field: key
        display_fields: [ "{{title}} - {{key}}" ]
        i18n: duplicate
        hint: 'Assignment of previously defined “PreNUDGE indicator dimension"'

      - label: "Measurement instrument (MED+TECH)"
        name: measurement-instrument
        required: false
        widget: "list"
        i18n: true
        summary: " · {{source-type}} · {{device}}{{questionnaire}} · "
        fields:
          - label: "Source Type · Measurement Method (MED)"
            name: source-type
            widget: select
            options: [ "Wearable device / sensor · automated", "Questionnaire · manual (self-reported)" ]
            i18n: duplicate
            hint: "Select"
          - label: "Measurement instrument (device/questionnaire) (MED)"
            name: device
            widget: string
            required: false
            hint: "Wearable (medical) device, sensor, etc. for acquisition: e.g. smartphone / questionnaire name e.g. WHOQOL-BREF"
          - label: "Measurement method specification (MED)"
            name: specific-questions
            widget: richtext
            required: false
            i18n: translate
            hint: "Details of the measurement method e.g., specific questions and answer options"
          - label: "Unit (MED)"
            name: unit
            required: false
            widget: string
            i18n: translate
            hint: "Physical unit or scale (e.g., hours, days, score)"
          - label: "Data format (MED)"
            name: data-format
            required: false
            widget: string
            i18n: translate
            hint: "Typical data formats used in a medical context for this observation (e.g., values are typically measured with an accuracy of two decimals)"
          - label: "Datatype (TECH)"
            name: data-type
            required: false
            widget: select
            options: ["numeric", "integer", "categorial", "date", "datetime", "time", "boolean"]
            i18n: duplicate
            hint: 'Technical data type derived from “medical” data format'
          - label: "Range of values (MED)"
            name: range-of-vales
            required: false
            widget: text
            i18n: duplicate
            hint: "Minimal and maximal (physiologically) feasible values"
          - label: "Acquisition frequency (MED)"
            name: acquisition-frequency
            required: false
            widget: text
            i18n: duplicate
            hint: "Minimum observation frequency required for qualification and meaningful data interpretation."
          - label: "Recommended monitoring frequency (MED)"
            name: recommended-monitoring-frequency
            required: false
            widget: text
            i18n: duplicate
            hint: "Recommended optimal measurement frequency based on clinical or research guidance to support better data interpretation."
          - label: "Recommendations (MED)"
            name: norms
            widget: "list"
            required: false
            i18n: true
            summary: "{{specific-norm}}"
            hint: "Reference ranges stratified by gender, age, etc."
            fields:
              - label: "Specific recommendations"
                name: specific-norm
                widget: richtext
                required: false
          - label: "Scoring algorithm (MED)"
            name: scoring-algorithm
            widget: richtext
            required: false
            hint: "Method used to transform raw data into a score/aggregate (e.g., sum, mean, inverse scoring)"
          - label: "Source/reference (MED)"
            name: sources
            widget: "list"
            required: false
            i18n: true
            summary: "{{source-description}}"
            hint: "Scientific publication, (interpretation) guidelines, or official recommendation underpinning the measurement instrument (e.g., WHO guidelines, NIH toolkit), acquisition frequency, specific norms, range of values, scoring algorithm; context, domain and intended interpretation of observations etc."
            fields:
              - label: "Source description"
                name: source-description
                widget: string
                required: false
                i18n: translate
                hint: "e.g. Österreichische Bewegungsempfehlungen"
              - label: "Source URL"
                name: system
                widget: string
                required: true
                i18n: duplicate
                hint: "e.g., https://fgoe.org/medien/reihewissen/bewegungsempfehlungen"
          - label: "Link to PreNUDGE FHIR Implementation Guide (TECH)"
            name: pn-fhir-ig-link
            widget: string
            required: false
            i18n: duplicate
            hint: "URL linking to corresponding PreNUDGE FHIR IG profile, if available"
          - label: "PreNUDGE FHIR Implementation Guide Status (MED+TECH)"
            name: pn-fhir-ig-status
            widget: select
            options: [ "draft", "open", "planned", "published", "amendment needed"]
            default: "draft"
            i18n: duplicate
            hint: "draft = completely newly added health indicator MED is still working on it (=default); open = completely newly added health indicator, currently not considered for IG implementation; planned = next candidate to be implemented in IG/implementation in IG ongoing; published = implemented in IG; amendment needed = health indicator already implemented in the IG but there was a change in the metadata and IG needs to be checked"
          - label: "PreNUDGE Sunburst Chart Status (MED+TECH)"
            name: vis-status
            widget: select
            options: [ "draft", "open", "planned", "published", "amendment needed" ]
            default: "draft"
            i18n: duplicate
            hint: "draft = completely newly added health indicator MED is still working on it (=default); open = completely newly added health indicator, currently not considered for IG implementation; planned = next candidate to be implemented in IG/implementation in IG ongoing; published = implemented in IG; amendment needed = health indicator already implemented in the IG but there was a change in the metadata and IG needs to be checked"
          - label: "Terminology Codes (TECH)"
            name: "terminology-codes"
            widget: "list"
            required: false
            i18n: true
            summary: "{{system}} · {{code}}"
            fields:
              - label: "System URL"
                name: system
                widget: "string"
                required: true
                i18n: duplicate
                hint: "e.g. http://loinc.org, http://snomed.info/sct"
              - label: "Code"
                name: code
                widget: "string"
                required: true
                i18n: duplicate
              - label: "Display / Description"
                name: display
                i18n: translate
                widget: "string"
                required: false
                hint: "Human-readable label (optional but recommended)"
          - label: "App Provider qualification requirment (TECH)"
            name: qualification
            widget: richtext
            required: false
            i18n: translate
            hint: "Derived specific requirements that app providers must meet to connect to the PreNUDGE platform"
          - label: "Qualified app providers (TECH)"
            name: app-providers
            widget: relation
            collection: data-provider
            search_fields: [ key, name, app-name ]
            value_field: key
            display_fields: [ "{{app-name}} · {{name}}" ]
            multiple: true
            required: false
            i18n: duplicate
            hint: "Applications within the PreNUDGE ecosystem that collect or provide this health indicator"


      - label: "Comments / Discussion Section for MED"
        name: discussion
        required: false
        widget: richtext
        i18n: duplicate
