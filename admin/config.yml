backend:
  name: gitea
  app_id: bf2506c8-ea2f-40c8-b315-59b39c02e7ae
#  api_root: https://health.joanneum.at/git/api/v1
#  base_url: https://health.joanneum.at/git
  api_root: http://localhost:8010/git/api/v1
  base_url: http://localhost:8010/git
  auth_endpoint: https://health.joanneum.at/git/login/oauth/authorize
  branch: main
  repo: PreNudge/prenudge-health-profile

# The Gitea backend does not support editorial workflow.
#publish_mode: editorial_workflow

media_folder: media
public_folder: /media

i18n:
  # 'single_file' speichert de und en zusammen in einer JSON-Datei.
  # Das ist für deine API am einfachsten zu verarbeiten.
  structure: single_file
  locales: [de, en]
  default_locale: de

collections:
  - name: categories
    label: Categories
    label_singular: 'Category'
    folder: hp-categories
    create: true # <--- Diese Zeile MUSS vorhanden sein
    i18n: true # Aktiviert i18n für diese gesamte Collection
    extension: "json" # Erzwingt die Endung .json statt .md
    format: "json"    # Sagt dem CMS, dass es JSON-Daten schreiben soll    create: true
    slug: "{{id_tech}}"  # Dateiname wird die technische ID    fields:
    fields:
      - label: Template
        name: template
        widget: hidden
        default: category
        i18n: duplicate
      - label: "Technische ID"
        name: id_tech
        widget: string
        i18n: duplicate
      - label: Title
        name: title
        widget: string
        # 'duplicate' kopiert den Wert von 'de' nach 'en',
        # falls 'en' noch leer ist (gut für technische Werte).
        i18n: translate
      - label: Description
        name: description
        widget: markdown
        # Feld ist übersetzbar
        i18n: translate
