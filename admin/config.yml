  - name: data-provider
    label: "Data/App Provider"
    label_singular: "Data/App Provider"
    folder: data-provider
    create: true
    i18n: true
    extension: json
    format: json
    slug: "{{key}}"
    summary: "{{app-name}} · {{name}}"

    fields:
      - label: Template
        name: template
        widget: hidden
        default: category
        i18n: duplicate

      - label: "Data/App Provider Key"
        name: key
        widget: string
        i18n: duplicate

      - label: "Data/App Provider Name"
        name: name
        widget: string
        i18n: duplicate

      - label: "Application Name"
        name: app-name
        widget: string
        i18n: duplicate

      - label: "Company Description"
        name: description
        required: false
        widget: richtext
        i18n: translate

      - label: "Company Logo"
        name: logo
        required: false
        widget: "image"
        i18n: duplicate

      - label: "App Logo"
        name: app-logo
        required: false
        widget: "image"
        i18n: duplicate
