<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PreNUDGE Health Profile — Sunburst</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 { font-size: 1.4rem; color: #222; font-weight: 600; }
    #meta { font-size: 0.8rem; color: #999; margin-top: 0.3rem; }

    #disclaimer {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      color: #664d03;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      max-width: 480px;
      text-align: center;
    }

    /* language toggle */
    #lang-toggle {
      display: inline-flex;
      margin-top: 0.75rem;
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid #ddd;
      background: #fff;
    }
    #lang-toggle button {
      padding: 4px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: transparent;
      color: #999;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.04em;
    }
    #lang-toggle button.active {
      background: #333;
      color: #fff;
    }

    #chart-wrap {
      position: relative;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 1rem;
    }

    svg { display: block; }

    .arc path {
      stroke: white;
      stroke-width: 1px;
      transition: opacity 0.15s;
      cursor: pointer;
    }
    .arc path:hover { opacity: 0.8; }

    .arc-label {
      font-size: 11px;
      fill: #333;
      pointer-events: none;
      user-select: none;
    }

    #center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      width: 130px;
    }
    #center-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      line-height: 1.3;
    }
    #center-hint {
      font-size: 10px;
      color: #bbb;
      margin-top: 4px;
    }

    #tooltip {
      position: fixed;
      background: rgba(20,20,20,0.88);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      max-width: 260px;
      z-index: 100;
    }
    #tooltip .path { color: #aaa; font-size: 11px; }

    #hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>PreNUDGE Health Profile</h1>
  <div id="meta"></div>
  <div id="lang-toggle">
    <button id="btn-de" class="active" onclick="switchLocale('de')">DE</button>
    <button id="btn-en"               onclick="switchLocale('en')">EN</button>
  </div>
</header>

<p id="disclaimer">Under construction — this page shows preliminary test data and is still being built out. Content and layout are subject to change.</p>

<div id="chart-wrap">
  <svg id="chart"></svg>
  <div id="center">
    <div id="center-title"></div>
    <div id="center-hint"></div>
  </div>
</div>

<p id="hint"></p>
<div id="tooltip"></div>

<script>
const SIZE   = 740;
const RADIUS = SIZE / 6;

let currentLocale = "de";
let labelSel;          // D3 selection — updated on locale switch
let focusNode;         // currently focused node — for center label update

// ── i18n strings ──────────────────────────────────────────────────────────

const I18N = {
  de: {
    hint:  "Klick auf ein Segment zum Vergrößern · Klick auf die Mitte zum Zurücknavigieren",
    back:  "← zurück",
    root:  "Health Profile",
  },
  en: {
    hint:  "Click a segment to zoom in · Click the center to navigate back",
    back:  "← back",
    root:  "Health Profile",
  },
};

// ── helpers ────────────────────────────────────────────────────────────────

function nodeName(d) {
  return d.data[`name_${currentLocale}`] || d.data.name_de || "";
}

function catColor(d) {
  const anc = d.ancestors().find(a => a.depth === 1);
  return anc ? (anc.data.color || "#bbb") : "#ddd";
}

function fillColor(d) {
  const base = catColor(d);
  if (d.depth === 1) return base;
  if (d.depth === 2) return d3.interpolateRgb(base, "#ffffff")(0.38);
  return d3.interpolateRgb(base, "#ffffff")(0.68);
}

function arcVisible(d) {
  return d.y1 <= 4 && d.y0 >= 1 && d.x1 > d.x0;
}

function labelVisible(d) {
  return d.y1 <= 4 && d.y0 >= 1 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.032;
}

function labelTransform(d) {
  const angle = (d.x0 + d.x1) / 2 * (180 / Math.PI);
  const r     = (d.y0 + d.y1) / 2 * RADIUS;
  return `rotate(${angle - 90}) translate(${r},0) rotate(${angle < 180 ? 0 : 180})`;
}

function breadcrumb(d) {
  return d.ancestors()
    .filter(a => a.depth > 0)
    .reverse()
    .map(a => nodeName(a))
    .join(" > ");
}

// ── build D3 hierarchy — stores both locales in each node ─────────────────

function buildHierarchy(profile) {
  function obsNode(obs) {
    return {
      name_de: (obs.de || {}).title || "",
      name_en: (obs.en || {}).title || (obs.de || {}).title || "",
      value: 1,
    };
  }
  function dimNode(dim) {
    return {
      name_de: (dim.de || {}).title || "",
      name_en: (dim.en || {}).title || (dim.de || {}).title || "",
      children: dim.observations.length > 0
        ? dim.observations.map(obsNode)
        : null,
    };
  }
  return {
    name_de: "PreNUDGE",
    name_en: "PreNUDGE",
    children: profile.categories.map(cat => ({
      name_de: (cat.de || {}).title || "",
      name_en: (cat.en || {}).title || (cat.de || {}).title || "",
      color:   (cat.de || cat.en || {}).color || "#bbb",
      children: cat.dimensions.length > 0
        ? cat.dimensions.map(dimNode)
        : null,
    })),
  };
}

// ── locale switch ──────────────────────────────────────────────────────────

function switchLocale(locale) {
  currentLocale = locale;

  document.getElementById("btn-de").classList.toggle("active", locale === "de");
  document.getElementById("btn-en").classList.toggle("active", locale === "en");
  document.getElementById("hint").textContent = I18N[locale].hint;

  // update arc labels in place — no re-render needed
  if (labelSel) {
    labelSel.text(d => nodeName(d));
  }

  // update center label
  if (focusNode !== undefined) setCenterLabel(focusNode);
}

// ── center label ──────────────────────────────────────────────────────────

function setCenterLabel(p) {
  focusNode = p;
  const t = I18N[currentLocale];
  document.getElementById("center-title").textContent =
    p.depth === 0 ? "PreNUDGE" : nodeName(p);
  document.getElementById("center-hint").textContent =
    p.depth === 0 ? t.root : t.back;
}

// ── main ──────────────────────────────────────────────────────────────────

d3.json("../health-profile.json").then(profile => {

  document.getElementById("meta").textContent =
    `Version ${profile.version} · ${profile.generated.slice(0, 10)}`;
  document.getElementById("hint").textContent = I18N[currentLocale].hint;

  const root = d3.hierarchy(buildHierarchy(profile))
    .sum(d => d.children ? 0 : d.value || 1)
    .sort((a, b) => b.value - a.value);

  d3.partition().size([2 * Math.PI, root.height + 1])(root);
  root.each(d => d.current = { x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 });

  // ── arc generator ─────────────────────────────────────────────────────

  const arc = d3.arc()
    .startAngle(d => d.x0)
    .endAngle(d => d.x1)
    .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.004))
    .padRadius(RADIUS * 1.5)
    .innerRadius(d => d.y0 * RADIUS)
    .outerRadius(d => Math.max(d.y0 * RADIUS, d.y1 * RADIUS - 1));

  const svg = d3.select("#chart")
    .attr("viewBox", [-SIZE / 2, -SIZE / 2, SIZE, SIZE])
    .attr("width",  SIZE)
    .attr("height", SIZE);

  // ── arcs ──────────────────────────────────────────────────────────────

  const path = svg.append("g").attr("class", "arc")
    .selectAll("path")
    .data(root.descendants().slice(1))
    .join("path")
      .attr("fill",          d => fillColor(d))
      .attr("fill-opacity",  d => arcVisible(d.current) ? 1 : 0)
      .attr("pointer-events",d => arcVisible(d.current) ? "auto" : "none")
      .attr("d",             d => arc(d.current));

  // ── labels — stored in module-level var for locale updates ────────────

  labelSel = svg.append("g")
    .attr("text-anchor", "middle")
    .selectAll("text")
    .data(root.descendants().slice(1))
    .join("text")
      .attr("class",        "arc-label")
      .attr("fill-opacity", d => +labelVisible(d.current))
      .attr("transform",    d => labelTransform(d.current))
      .text(d => nodeName(d));

  // ── center circle (back button) ───────────────────────────────────────

  const parent = svg.append("circle")
    .datum(root)
    .attr("r", RADIUS)
    .attr("fill", "white")
    .attr("fill-opacity", 0.92)
    .attr("cursor", "pointer")
    .on("click", clicked);

  setCenterLabel(root);

  // ── tooltip ───────────────────────────────────────────────────────────

  const tooltip = d3.select("#tooltip");

  path
    .on("mousemove", (event, d) => {
      tooltip
        .style("opacity", 1)
        .style("left", (event.clientX + 14) + "px")
        .style("top",  (event.clientY - 10) + "px")
        .html(`<strong>${nodeName(d)}</strong><br>
               <span class="path">${breadcrumb(d)}</span>`);
    })
    .on("mouseleave", () => tooltip.style("opacity", 0))
    .on("click", clicked);

  // ── zoom / click ──────────────────────────────────────────────────────

  function clicked(event, p) {
    tooltip.style("opacity", 0);
    parent.datum(p.parent || root);

    root.each(d => {
      d.target = {
        x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
        x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
        y0: Math.max(0, d.y0 - p.depth),
        y1: Math.max(0, d.y1 - p.depth),
      };
    });

    const t = svg.transition().duration(700).ease(d3.easeCubicInOut);

    path.transition(t)
      .tween("data", d => {
        const i = d3.interpolate(d.current, d.target);
        return t => d.current = i(t);
      })
      .filter(function(d) {
        return +this.getAttribute("fill-opacity") || arcVisible(d.target);
      })
      .attr("fill-opacity",   d => arcVisible(d.target) ? 1 : 0)
      .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
      .attrTween("d", d => () => arc(d.current));

    labelSel
      .filter(function(d) {
        return +this.getAttribute("fill-opacity") || labelVisible(d.target);
      })
      .transition(t)
      .attr("fill-opacity", d => +labelVisible(d.target))
      .attrTween("transform", d => () => labelTransform(d.current));

    setCenterLabel(p);
  }

}).catch(err => {
  document.body.innerHTML =
    `<p style="color:red;padding:2rem">Fehler beim Laden von health-profile.json:<br>
     <code>${err}</code><br><br>
     Bitte den Server aus dem Projektroot starten:<br>
     <code>py -m http.server</code></p>`;
});
</script>
</body>
</html>
