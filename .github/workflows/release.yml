name: Release

# Runs on version tags (vX.Y.Z), or manually via workflow_dispatch with
# an explicit version input (creates/updates that tag + release too -
# not a dry run). Builds health-profile.json, the Markdown reports, and
# Word exports (via AsciiDoc -> DocBook -> Pandoc), then publishes them
# as a GitHub Release. Does not commit anything back to the repo - see
# doc/github-actions-plan.md, Design-Entscheidung 4.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v, e.g. 0.1.0 (creates/updates this tag + release)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for git log (activity history)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install jinja2 python-docx

      - name: Install asciidoctor
        run: sudo gem install asciidoctor --no-document

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF_NAME}"
            echo "value=${TAG#v}" >> $GITHUB_OUTPUT
          fi
          # Date of the released commit, not the build time - so re-running/re-tagging
          # later doesn't silently shift the date shown in the reports.
          echo "generated=$(git log -1 --format=%ad --date=short)" >> $GITHUB_OUTPUT

      - name: Validate references
        run: python scripts/validate.py --strict

      - name: Consolidate JSON
        run: python scripts/consolidate.py --version ${{ steps.version.outputs.value }}

      - name: Render Markdown reports
        run: python scripts/render_doc.py --version ${{ steps.version.outputs.value }}

      - name: Render AsciiDoc
        run: python scripts/render_adoc.py --version ${{ steps.version.outputs.value }} --generated ${{ steps.version.outputs.generated }}

      - name: Convert AsciiDoc to Word via DocBook
        run: |
          set -e
          VERSION="${{ steps.version.outputs.value }}"
          GENERATED="${{ steps.version.outputs.generated }}"
          REFERENCE_DOCX="render/templates/PräNUDGE Berichtsvorlage.docx"
          for lang in de en; do
            asciidoctor "health-profile-v${VERSION}.${lang}.adoc" -b docbook -o "/tmp/health-profile-v${VERSION}.${lang}.xml"
            if [ "$lang" = "de" ]; then
              toc_title="Inhaltsverzeichnis"
              title="PreNUDGE Gesundheitsprofil — Katalog"
            else
              toc_title="Table of Contents"
              title="PreNUDGE Health Profile — Catalogue"
            fi
            pandoc -f docbook -t docx \
              --toc --toc-depth=3 \
              -M toc-title="$toc_title" \
              --reference-doc="$REFERENCE_DOCX" \
              -o "health-profile-v${VERSION}.${lang}.docx" \
              "/tmp/health-profile-v${VERSION}.${lang}.xml"
            python scripts/inject_cover_page.py "health-profile-v${VERSION}.${lang}.docx" \
              --reference "$REFERENCE_DOCX" \
              --title "$title" --version "$VERSION" --generated "$GENERATED" --lang "$lang"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: |
            health-profile.json
            health-profile-v${{ steps.version.outputs.value }}.de.md
            health-profile-v${{ steps.version.outputs.value }}.en.md
            health-profile-v${{ steps.version.outputs.value }}.de.docx
            health-profile-v${{ steps.version.outputs.value }}.en.docx
