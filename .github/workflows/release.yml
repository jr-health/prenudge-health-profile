name: Release

# Runs manually via workflow_dispatch with an explicit version input (creates
# the tag + release - not a dry run). Builds health-profile.json, the
# Markdown reports, and Word exports (via AsciiDoc -> DocBook -> Pandoc),
# commits the regenerated health-profile.json/browse/sunburst views to main,
# then tags that commit and publishes a GitHub Release from it.
#
# workflow_dispatch-only, no `push: tags:` trigger - direct tag pushes used
# to also create a release, but the tag would point at whatever commit was
# on main at push time, which predates this run's regen commit. pages.yml
# pins the live sunburst/browse pages to the release tag's commit, so any
# such release would ship with a browse/sunburst page one version behind
# Explore. Committing the regen and THEN tagging (this workflow, in order)
# is what keeps them in sync - see doc/release.md.
#
# This workflow now commits health-profile.json and render/browse|sunburst.*.html
# to main (the same files update-profile.yml commits) as part of a release run -
# see the addendum after doc/github-actions-plan.md, Design-Entscheidung 5. It
# still never commits the dated .md/.docx report exports - those remain
# release-only assets, never repo content.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v, e.g. 0.1.0 (creates this tag + release)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for git log (activity history)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install jinja2 python-docx

      - name: Install asciidoctor
        run: sudo gem install asciidoctor --no-document

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Determine version
        id: version
        run: |
          # Strip a leading "v" defensively even though the input description says
          # not to include one - a workflow_dispatch run with "v0.1.8-test" typed in
          # once produced a "vv0.1.8-test" tag (tag_name below re-adds "v"), which
          # then out-sorted every properly-formed tag in scripts/tools that pick the
          # "latest" version by lexical tag sort.
          INPUT="${{ github.event.inputs.version }}"
          echo "value=${INPUT#v}" >> $GITHUB_OUTPUT
          # Date of the commit checked out at the start of this run, not the build
          # time and not the regen commit made later in this same run - so re-running
          # this workflow for the same version on a later day doesn't shift the date
          # shown in the reports.
          echo "generated=$(git log -1 --format=%ad --date=short)" >> $GITHUB_OUTPUT

      - name: Validate references
        run: python scripts/validate.py --strict

      - name: Consolidate JSON
        run: python scripts/consolidate.py --version ${{ steps.version.outputs.value }}

      - name: Render browse/sunburst views
        run: python scripts/render_html.py

      # Commits the just-regenerated health-profile.json and render/browse|sunburst
      # views to main BEFORE the tag is created below, so the tag - and therefore
      # the pages.yml build pinned to it - points at a commit that already carries
      # this version's browse/sunburst pages instead of the previous release's.
      - name: Commit regenerated files to main
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-profile.json render/browse.de.html render/browse.en.html render/sunburst.de.html render/sunburst.en.html
          if git diff --staged --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "chore: regenerate health profile v${{ steps.version.outputs.value }}"
            git push
          fi
          # Read back after the (possibly skipped) commit, and pass explicitly as
          # target_commitish below - softprops/action-gh-release's default target
          # is documented as "SHA of current commit" (i.e. the pre-regen checkout),
          # which would silently undo the fix this step exists for.
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Render Markdown reports
        run: python scripts/render_doc.py --version ${{ steps.version.outputs.value }} --generated ${{ steps.version.outputs.generated }}

      # One Word export per data set (see scripts/consolidate.py --scope), in both
      # languages. The combined set is built from the health-profile.json already
      # consolidated above and keeps the unsuffixed filename, so existing download
      # links stay valid; minimalset/extended are consolidated into their own
      # temporary JSON and get a filename suffix.
      - name: Render AsciiDoc and convert to Word via DocBook
        run: |
          set -e
          VERSION="${{ steps.version.outputs.value }}"
          GENERATED="${{ steps.version.outputs.generated }}"
          REFERENCE_DOCX="render/templates/PräNUDGE Berichtsvorlage.docx"

          for scope in combined minimalset extended; do
            if [ "$scope" = "combined" ]; then
              suffix=""
              src="health-profile.json"
            else
              suffix="-${scope}"
              src="/tmp/health-profile-${scope}.json"
              python scripts/consolidate.py --version "$VERSION" --scope "$scope" --out "$src"
            fi

            # --suffix=... (equals form): the value starts with a hyphen, which
            # argparse would otherwise parse as the next option.
            python scripts/render_adoc.py \
              --src "$src" \
              --version "$VERSION" \
              --generated "$GENERATED" \
              --suffix="$suffix"

            STEM="health-profile-v${VERSION}-${GENERATED}${suffix}"
            for lang in de en; do
              asciidoctor "${STEM}.${lang}.adoc" -b docbook -o "/tmp/${STEM}.${lang}.xml"
              if [ "$lang" = "de" ]; then
                toc_title="Inhaltsverzeichnis"
                title="PreNUDGE Gesundheitsprofil — Katalog"
                case "$scope" in
                  minimalset) title="${title} (Minimalset)" ;;
                  extended)   title="${title} (Erweiterter Datensatz)" ;;
                esac
              else
                toc_title="Table of Contents"
                title="PreNUDGE Health Profile — Catalogue"
                case "$scope" in
                  minimalset) title="${title} (Minimal Set)" ;;
                  extended)   title="${title} (Extended Set)" ;;
                esac
              fi
              pandoc -f docbook -t docx \
                --toc --toc-depth=3 \
                -M toc-title="$toc_title" \
                --reference-doc="$REFERENCE_DOCX" \
                -o "${STEM}.${lang}.docx" \
                "/tmp/${STEM}.${lang}.xml"
              python scripts/inject_cover_page.py "${STEM}.${lang}.docx" \
                --reference "$REFERENCE_DOCX" \
                --title "$title" --version "$VERSION" --generated "$GENERATED" --lang "$lang"
              python scripts/style_inline_headings.py "${STEM}.${lang}.docx"
            done
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          files: |
            health-profile.json
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}.de.md
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}.en.md
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}.de.docx
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}.en.docx
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}-minimalset.de.docx
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}-minimalset.en.docx
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}-extended.de.docx
            health-profile-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.generated }}-extended.en.docx
