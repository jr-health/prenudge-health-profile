name: Update Health Profile

# Runs when data files, scripts, or templates change, or after a Release
# completes (so main's health-profile.json picks up the new version/date
# even if no content changed since - release.yml itself never commits).
# Generated files are committed back without [skip ci] - the path filter
# above already excludes those files, so the commit-back can't re-trigger
# this workflow via push. [skip ci] used to be added as a second safety
# net, but it also silently suppressed EVERY workflow (including
# release.yml) for any tag later pushed at that exact commit - see
# doc/github-actions-plan.md, Phase 5, Schritt 23.
on:
  push:
    branches: [main]
    paths:
      - 'hp-categories/**'
      - 'hp-dimensions/**'
      - 'hp-observations/**'
      - 'data-provider/**'
      - 'scripts/**'
      - 'render/templates/**'
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main                # workflow_run doesn't default to this branch
          fetch-depth: 0          # needed for git log (activity history) and git tag lookup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install jinja2

      - name: Validate references
        run: python scripts/validate.py --strict

      - name: Read version from latest release tag
        id: version
        run: |
          TAG=$(git tag --sort=-version:refname | head -1)
          VERSION="${TAG#v}"
          echo "value=${VERSION:-unreleased}" >> $GITHUB_OUTPUT

      - name: Consolidate JSON
        run: python scripts/consolidate.py --version ${{ steps.version.outputs.value }}

      - name: Render Markdown reports
        run: python scripts/render_doc.py --version ${{ steps.version.outputs.value }} --latest

      - name: Render browse/sunburst views
        run: python scripts/render_html.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-profile.json health-profile.de.md health-profile.en.md render/browse.de.html render/browse.en.html render/sunburst.de.html render/sunburst.en.html
          if git diff --staged --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "chore: regenerate health profile v${{ steps.version.outputs.value }}"
            git push
          fi
