name: Deploy GitHub Pages

# Runs after a successful Release (workflow_run), manually via
# workflow_dispatch, or on a push that touches admin/** (so CMS schema
# changes reach the Page promptly). The admin/ mirror always reflects
# the triggering checkout (may run ahead of the last release via CMS
# edits) while sunburst/browse/downloads are re-pinned to the latest
# release below — see doc/github-actions-plan.md, Design-Entscheidung 5
# and "Pinning sunburst/browse to the release".
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'admin/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Determine latest release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout released commit for sunburst/browse
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: released

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install jinja2

      - name: Build _site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/render
          cp -r admin _site/admin
          cp -r media _site/media
          # sunburst/browse come from the released commit (./released), not the
          # checkout above, so they never drift ahead of the health-profile.json/
          # docx downloaded below — even when this run was triggered by an
          # unreleased admin/ change.
          cp released/render/sunburst.de.html _site/render/sunburst.de.html
          cp released/render/sunburst.en.html _site/render/sunburst.en.html
          cp released/render/sunburst.js _site/render/sunburst.js
          cp released/render/browse.de.html _site/render/browse.de.html
          cp released/render/browse.en.html _site/render/browse.en.html
          cp released/render/browse.js _site/render/browse.js

          RELEASE_VERSION="${{ steps.release.outputs.version }}"
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/latest/download"

          # health-profile.json is NOT taken from the checkout: release.yml never commits
          # its regenerated version/date back to main, so the repo copy is stale. The
          # release asset is the only place that has the version/date matching this release.
          gh release download "v${RELEASE_VERSION}" --repo ${{ github.repository }} \
            --pattern health-profile.json --dir _site --clobber

          GENERATED=$(jq -r '.generated // ""' _site/health-profile.json | cut -c1-10)

          python scripts/render_index.py \
            --version "$RELEASE_VERSION" \
            --generated "$GENERATED" \
            --release-base "$RELEASE_BASE" \
            --profile _site/health-profile.json \
            --out-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
