name: Deploy GitHub Pages

# Runs after a successful Release (workflow_run), or manually via
# workflow_dispatch as a manual fallback — deliberately NOT on every
# push to main. The Page shows the released state, not the working
# state (see doc/github-actions-plan.md, Design-Entscheidung 5).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Determine latest release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build _site
        run: |
          mkdir -p _site/render
          cp -r admin _site/admin
          cp -r media _site/media
          cp health-profile.json _site/health-profile.json
          cp render/sunburst.html _site/render/sunburst.html
          cp render/browse.de.html _site/render/browse.de.html
          cp render/browse.en.html _site/render/browse.en.html

          VERSION=$(jq -r '.version // "unreleased"' health-profile.json)
          GENERATED=$(jq -r '.generated // ""' health-profile.json | cut -c1-10)
          RELEASE_VERSION="${{ steps.release.outputs.version }}"
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/latest/download"

          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PreNUDGE Health Profile</title>
          </head>
          <body>
            <h1>PreNUDGE Health Profile</h1>
            <p>Version $VERSION · Generated: $GENERATED</p>
            <ul>
              <li><a href="render/sunburst.html">Sunburst visualization</a></li>
              <li><a href="render/browse.de.html">Browse (DE)</a></li>
              <li><a href="render/browse.en.html">Browse (EN)</a></li>
              <li><a href="admin/index.html">CMS editor</a></li>
            </ul>
            <ul>
              <li><a href="$RELEASE_BASE/health-profile-v$RELEASE_VERSION.de.docx">Download report (DE, Word)</a></li>
              <li><a href="$RELEASE_BASE/health-profile-v$RELEASE_VERSION.en.docx">Download report (EN, Word)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
