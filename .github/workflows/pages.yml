name: Deploy GitHub Pages

# Runs after a successful Release (workflow_run), or manually via
# workflow_dispatch as a manual fallback — deliberately NOT on every
# push to main. The Page shows the released state, not the working
# state (see doc/github-actions-plan.md, Design-Entscheidung 5).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Determine latest release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build _site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/render
          cp -r admin _site/admin
          cp -r media _site/media
          cp render/sunburst.html _site/render/sunburst.html
          cp render/browse.de.html _site/render/browse.de.html
          cp render/browse.en.html _site/render/browse.en.html

          RELEASE_VERSION="${{ steps.release.outputs.version }}"
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/latest/download"

          # health-profile.json is NOT taken from the checkout: release.yml never commits
          # its regenerated version/date back to main, so the repo copy is stale. The
          # release asset is the only place that has the version/date matching this release.
          gh release download "v${RELEASE_VERSION}" --repo ${{ github.repository }} \
            --pattern health-profile.json --dir _site --clobber

          GENERATED=$(jq -r '.generated // ""' _site/health-profile.json | cut -c1-10)

          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>PreNUDGE Health Profile</title>
          <style>
            body {
              font-family: Verdana, Geneva, sans-serif;
              margin: 2rem;
              color: #1a1a1a;
            }
            header {
              display: flex;
              align-items: center;
              gap: 1rem;
              margin-bottom: 0.25rem;
            }
            header img { height: 48px; }
            h1 { margin: 0; color: #004E64; }
            .meta { color: #666; margin-bottom: 1.5rem; }
            ul { line-height: 1.8; }
            a { color: #004E64; }
            footer {
              margin-top: 2rem;
              color: #666;
              font-size: 14px;
            }
            footer a { color: #666; }
            .disclaimer {
              background: #fff3cd;
              border: 1px solid #ffe69c;
              color: #664d03;
              padding: 0.6rem 1rem;
              border-radius: 6px;
              margin-bottom: 1.5rem;
              font-size: 14px;
            }
          </style>
          </head>
          <body>

          <header>
            <a href="https://prenudge.at/"><img src="media/PräNUDGE_Logo.png" alt="PreNUDGE"></a>
            <h1>PreNUDGE Health Profile</h1>
          </header>
          <p class="meta">Version $RELEASE_VERSION · Generated: $GENERATED</p>

          <p class="disclaimer">Under construction — this page shows preliminary test data and is still being built out. Content and layout are subject to change.</p>

          <ul>
            <li><a href="render/sunburst.html">Sunburst visualization</a></li>
            <li>Browse (<a href="render/browse.de.html">DE</a> | <a href="render/browse.en.html">EN</a>)</li>
            <li><a href="admin/index.html">Metadata CMS Editor</a></li>
          </ul>
          <ul>
            <li>Download Health Profile Metadata (<a href="$RELEASE_BASE/health-profile-v$RELEASE_VERSION.de.docx">DE</a> | <a href="$RELEASE_BASE/health-profile-v$RELEASE_VERSION.en.docx">EN</a>)</li>
          </ul>

          <footer>
            <a href="https://prenudge.at/#konsortium">PreNUDGE Consortium</a>
          </footer>

          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
